function buildTrees(seed){
  treeGroup.clear();bushGroup.clear();rockGroup.clear();trees=genTrees(seed);
  for(const t of trees){
    const k=new THREE.Mesh(new THREE.CylinderGeometry(t.r*.8,t.r,t.h,8),trunkMat);k.position.set(t.x,t.h/2,t.z);treeGroup.add(k);
    const l=new THREE.Mesh(new THREE.SphereGeometry(3+t.r*2,8,6),leafMat);l.position.set(t.x,t.h+1.5,t.z);treeGroup.add(l);
  }
  const occupied=[];
  const bushSites=[];
  for(const p of genTrees(seed^0x35a1f)){
    if(!trees.every(t=>Math.hypot(p.x-t.x,p.z-t.z)>t.r+2.5)||!occupied.every(o=>Math.hypot(p.x-o.x,p.z-o.z)>1.45))continue;

  }

    const p=bushSites[i],g=new THREE.Group();g.position.set(p.x,0,p.z);g.rotation.y=i*2.399;
    const crown=new THREE.Mesh(bushGeo,bushMats[i%bushMats.length]);crown.position.y=.34+p.r*.12;crown.scale.set(p.r*.65,.38+p.r*.14,p.r*.65);g.add(crown);
    for(let j=0;j<4;j++){

    }
    bushGroup.add(g);
  }
  const rockSites=[];
  for(const p of genTrees(seed^0x75bcd15)){
    if(!trees.every(t=>Math.hypot(p.x-t.x,p.z-t.z)>t.r+1.5)||!occupied.every(o=>Math.hypot(p.x-o.x,p.z-o.z)>1.35))continue;
    rockSites.push(p);occupied.push({x:p.x,z:p.z});if(rockSites.length===45)break;
  }

    const p=rockSites[i],g=new THREE.Group(),sx=.3+p.r*.3,sy=.22+p.r*.16,sz=.3+p.r*.28;
    g.position.set(p.x,0,p.z);g.rotation.y=i*1.73;
    const stone=new THREE.Mesh(rockGeo,rockMats[i%rockMats.length]);stone.position.y=sy*.72;stone.scale.set(sx,sy,sz);stone.rotation.set(i*.31,i*.47,i*.23);g.add(stone);
    if(i%3===0){const chip=new THREE.Mesh(rockGeo,rockMats[(i+2)%rockMats.length]);chip.position.set(sx*.7,sy*.28,sz*.45);chip.scale.set(sx*.42,sy*.45,sz*.4);g.add(chip)}
    rockGroup.add(g);
  }
}

function mkProjectile(kind){
  const g=new THREE.Group();
  if(kind===2){
    const body=new THREE.Mesh(bulletBodyGeo,projectileBrassMat);body.position.z=-.025;
    const tip=new THREE.Mesh(bulletHeadGeo,projectileSteelMat);tip.position.z=.085;

function showImpact(m){

    const rim=new THREE.Mesh(bulletRimGeo,bulletRimMat),hole=new THREE.Mesh(bulletHoleGeo,bulletHoleMat);hole.position.z=.002;mark.add(rim,hole);

  }else{
    mark.position.copy(position);

function showKnifeMark(m){

let lastList=[],cur=0,bnT;

// ---------- sound (synthesized, no files) ----------
let AC,master,NB;
function audio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const w=AC.createBufferSource(),wf=AC.createBiquadFilter(),wg=AC.createGain();w.buffer=NB;w.loop=true;wf.type='lowpass';wf.frequency.value=450;wg.gain.value=.06;w.connect(wf);wf.connect(wg);wg.connect(master);w.start();
  (function birds(){setTimeout(()=>{if(master.gain.value){const f=2000+Math.random()*1500;tone('sine',f,f*1.3,.09,.05);tone('sine',f*1.2,f*1.5,.09,.05,.12)}birds()},3000+Math.random()*6000)})();
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);
}
function noise(dur,vol,f0,f1,type='bandpass'){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const sfx={

  bow:()=>{tone('triangle',420,90,.18,.25);noise(.25,.35,3000,600)},
  musket:()=>{noise(.6,.8,2500,120,'lowpass');tone('sine',90,35,.4,.5);[1.2,2.4,3.4,4.3].forEach(d=>tone('square',800,500,.05,.1,d));tone('square',300,200,.06,.25,4.9)},
  dagger:()=>noise(.2,.3,5000,1500),

function label(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='bold 34px system-ui';x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(text,128,45);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(2,.5,1);s.position.y=2.3;s.renderOrder=9;return s;

function mkPlayer(name,id){
  const g=new THREE.Group(),col=new THREE.Color().setHSL((id*.37)%1,.6,.5),m=new THREE.MeshLambertMaterial({color:col});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.2,8),m);b.position.y=.6;

function mkMob(type){
  const g=new THREE.Group(),bodyMat=mobMats[type];
  const part=(material,x,y,z,sx,sy,sz)=>{const mesh=new THREE.Mesh(mobSphereGeo,material);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);g.add(mesh);return mesh};

    const beak=new THREE.Mesh(new THREE.ConeGeometry(.07,.14,5),mobMats.beak);beak.rotation.x=-Math.PI/2;beak.position.set(0,.55,-.28);g.add(beak);
    part(mobMats.comb,0,.75,-.12,.065,.09,.06);part(bodyMat,-.2,.34,0,.12,.13,.22);part(bodyMat,.2,.34,0,.12,.13,.22);
    for(const x of [-.09,.09]){part(mobEyeMat,x,.6,-.255,.025,.03,.015);const leg=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.16,5),mobMats.beak);leg.position.set(x,.08,0);g.add(leg)}
  }else if(type==='rabbit'){

    part(bodyMat,-.09,.78,-.2,.055,.24,.07);part(bodyMat,.09,.78,-.2,.055,.24,.07);
    for(const x of [-.105,.105])part(mobEyeMat,x,.52,-.34,.022,.025,.015);
  }else{
    part(bodyMat,0,.55,.08,.38,.42,.55);part(bodyMat,0,1.12,-.25,.31,.31,.32);part(mobMats.muzzle,0,1.02,-.53,.19,.15,.13);
    part(mobEyeMat,-.12,1.2,-.52,.035,.035,.025);part(mobEyeMat,.12,1.2,-.52,.035,.035,.025);
    part(bodyMat,-.25,1.35,-.3,.1,.12,.1);part(bodyMat,.25,1.35,-.3,.1,.12,.1);
    for(const x of [-.24,.24])for(const z of [-.25,.34])part(bodyMat,x,.2,z,.14,.22,.16);

}
function syncMobs(list){
  const seen=new Set();
  for(const [id,type,x,y,z,hp,maxHp] of list){
    seen.add(id);let mob=mobModels.get(id);
    if(!mob){mob={g:mkMob(type),target:new THREE.Vector3(x,y,z),type,hp,maxHp};scene.add(mob.g);mobModels.set(id,mob)}
    mob.target.set(x,y,z);mob.hp=hp;mob.maxHp=maxHp;
  }
  for(const [id,mob] of mobModels)if(!seen.has(id)){scene.remove(mob.g);mobModels.delete(id)}
}
const survivalClock=ms=>{const seconds=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')};
const gameOverText=()=>`GAME OVER\nSurvived ${survivalClock(survivalElapsed)}\nScore ${selfData?selfData.sc:0}`;
// ---------- network ----------
function go(mode,code){audio();
  $('err').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:$('name').value.trim()||'Archer',mode,code}));
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{if(joined)location.reload();else if(!$('err').textContent)$('err').textContent='Cannot reach server'};
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function on(m){
  if(m.t==='err'){$('err').textContent=m.msg;ws.close()}
  else if(m.t==='welcome'){
    joined=true;me=m.id;survivalMode=m.mode==='survival';gameOver=false;survivalElapsed=0;buildTrees(m.seed);pos.set(m.x,0,m.z);
    $('menu').style.display='none';$('hud').style.display='block';
    $('survivalTimer').style.display=survivalMode?'block':'none';$('survivalTimer').textContent='SURVIVED 00:00';
    $('code').textContent=m.mode==='survival'?'Survival · Solo':(m.pub?'Public match':'Lobby code: '+m.code);showMsg('Click to play');
  }else if(m.t==='s')snapshot(m);
  else if(m.t==='impact')showImpact(m);
  else if(m.t==='slash')showKnifeMark(m);
  else if(m.t==='mobKill'){
    if(selfData){selfData.sc+=m.points;if(m.healed)selfData.hp=Math.min(3,selfData.hp+1)}
    $('banner').textContent=m.mobType.toUpperCase()+' +'+m.points+' pts'+(m.healed?' · +1 heart':'');clearTimeout(bnT);bnT=setTimeout(()=>$('banner').textContent='',2200);
  }else if(m.t==='gameover'){
    gameOver=true;dead=true;survivalElapsed=m.survivedMs;selfData={...selfData,sc:m.score};showMsg(gameOverText());
    if(document.pointerLockElement===rend.domElement)document.exitPointerLock();
  }
  else if(m.t==='kill'){
    if(m.ki===me)sfx.kill();else if(m.vi===me)sfx.die();
    const d=document.createElement('div');if(m.ki===me||m.vi===me)d.className='me';
    d.innerHTML=`<b class="k"></b> <span></span> <b class="v"></b>`;d.children[0].textContent=m.k;d.children[1].textContent=['🏹','🏹','🔫','🗡️','🔪'][m.w]+' '+WN[m.w];d.children[2].textContent=m.v;
    $('feed').append(d);setTimeout(()=>d.remove(),5000);if($('feed').children.length>6)$('feed').firstChild.remove();
  }else if(m.t==='rs'){pos.set(m.x,0,m.z);vy=0;dead=false;showMsg(locked?'':'Click to play')}
  else if(m.t==='bn'){$('banner').textContent=m.text;clearTimeout(bnT);bnT=setTimeout(()=>$('banner').textContent='',4500)}
  else if(m.t==='hurt'){sfx.hurt();$('flash').style.opacity=.5;setTimeout(()=>$('flash').style.opacity=0,120)}
  else if(m.t==='hit'){sfx.hit();$('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),150)}
}
function snapshot(m){
  survivalMode=m.mode==='survival';
  const seen=new Set();
  for(const [id,name,x,y,z,yw,pt,hp,sc,dd,kl] of m.p){
    seen.add(id);
    if(id===me){selfData={hp,sc,kl};if(dd&&!dead){dead=true;if(survivalMode){gameOver=true;const sv=(m.sv||[]).find(s=>s[0]===me);if(sv)survivalElapsed=sv[1];showMsg(gameOverText())}else showMsg('Eliminated. Respawning…')}continue}
    let p=players.get(id);if(!p){p={g:mkPlayer(name,id)};players.set(id,p)}
    p.t=new THREE.Vector3(x,y,z);p.yaw=yw;p.g.visible=!dd;if(!p.init){p.g.position.copy(p.t);p.init=1}
  }
  for(const [id,p] of players)if(!seen.has(id)){scene.remove(p.g);players.delete(id)}
  const as=new Set();
  for(const [id,x,y,z,vx,vy2,vz,g,k] of m.a){
    as.add(id);let a=arrows.get(id);
    if(!a){a={g,mesh:mkProjectile(k),p:new THREE.Vector3(),v:new THREE.Vector3()};scene.add(a.mesh);arrows.set(id,a);const d0=Math.hypot(x-pos.x,y-pos.y-1.6,z-pos.z);if(d0>6&&d0<45)sfx.whoosh(1-d0/45)}
    a.p.set(x,y,z);a.v.set(vx,vy2,vz);
  }
  for(const [id,a] of arrows)if(!as.has(id)){const d1=a.p.distanceTo(cam.position);if(d1<45)sfx.thunk(1-d1/45);scene.remove(a.mesh);arrows.delete(id)}
  if(survivalMode){
    syncMobs(m.mobs||[]);$('survivalTimer').style.display='block';
    const state=(m.sv||[]).find(s=>s[0]===me);if(state){survivalElapsed=state[1];$('survivalTimer').textContent='SURVIVED '+survivalClock(survivalElapsed)}
  }else{$('survivalTimer').style.display='none';syncMobs([])}
  hud(m.p);
}
function hud(list){lastList=list;if($('tab').style.display==='block')renderTab();
  if(selfData){$('hearts').textContent='❤'.repeat(selfData.hp)+'🖤'.repeat(Math.max(0,3-selfData.hp));$('me').textContent=selfData.sc+' pts · '+selfData.kl+' kills'}
  $('board').innerHTML=[...list].sort((a,b)=>b[8]-a[8]).slice(0,6).map(p=>`<div class="${p[0]===me?'me':''}"><span>${p[1].replace(/</g,'&lt;')}</span><span>${p[8]}</span></div>`).join('');
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderTab(){
  $('tab').innerHTML='<h2>Scoreboard</h2><table><tr><th>Archer</th><th>Kills</th><th>Points</th><th>Hearts</th></tr>'+
  [...lastList].sort((a,b)=>b[8]-a[8]).map(p=>`<tr class="${p[0]===me?'me':p[9]?'x':''}"><td>${esc(p[1])}</td><td>${p[10]}</td><td>${p[8]}</td><td>${p[9]?'dead':'❤'.repeat(p[7])}</td></tr>`).join('')+'</table>';

function showTab(on){$('tab').style.display=on?'block':'none';if(on)renderTab()}
function showMsg(t){const e=$('msg');e.textContent=t;e.style.display=t?'flex':'none'}
// ---------- input ----------
$('pub').onclick=()=>go('public');$('sur').onclick=()=>go('survival');$('mk').onclick=()=>go('create');
$('jn').onclick=()=>go('join',$('jc').value);
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Tab'){e.preventDefault();if(joined)showTab(true)}if(e.code==='KeyM'&&master)master.gain.value=master.gain.value?0:.5;if(e.code==='KeyQ'&&joined&&!dead&&!e.repeat){cur=(cur+1)%WN.length;charging=0;tx({t:'w',i:cur});sfx.swap()}});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code==='Tab')showTab(false)});addEventListener('blur',()=>showTab(false));
rend.domElement.addEventListener('click',()=>{audio();if(joined)rend.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===rend.domElement;showMsg(gameOver?gameOverText():locked?(dead?'Eliminated. Respawning…':''):(joined?'Click to play':''))});
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))});
const fire=()=>{shotAt[cur]=performance.now();if(cur===4)knifeSlashStyle=(knifeSlashStyle+1)%3;tx({t:'s',x:pos.x,y:pos.y,z:pos.z,yaw,pitch});sfx[WN[cur]]()};
addEventListener('mousedown',e=>{
  if(!locked||dead||e.button!==0)return;const D=WD[WN[cur]],now=performance.now();
  if(now-shotAt[cur]<D.reload)return;
  if(D.charge){charging=now;tx({t:'c'});sfx.draw()}else fire();
});
addEventListener('mouseup',e=>{ // charged weapons: hold the full time, then release to fire
  if(!charging||e.button!==0)return;const D=WD[WN[cur]],held=performance.now()-charging;charging=0;
  if(!dead&&held>=D.charge)fire();

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
// ---------- loop ----------
let last=performance.now(),sent=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(joined&&locked&&!gameOver){
    const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=(keys.ShiftLeft?9:6)*dt*(dead?2:1);
    const l=Math.hypot(f,s)||1,sy=Math.sin(yaw),cy=Math.cos(yaw);
    pos.x+=(-sy*f+cy*s)/l*sp;pos.z+=(-cy*f-sy*s)/l*sp;
    pos.x=Math.max(-MAP,Math.min(MAP,pos.x));pos.z=Math.max(-MAP,Math.min(MAP,pos.z));
    if(dead)pos.y=10;
    else{
      if(keys.Space&&pos.y===0)vy=7;vy-=20*dt;pos.y=Math.max(0,pos.y+vy*dt);if(pos.y===0)vy=0;
      for(const t of trees){const dx=pos.x-t.x,dz=pos.z-t.z,d=Math.hypot(dx,dz),m=t.r+.4;if(d<m&&d>0){pos.x=t.x+dx/d*m;pos.z=t.z+dz/d*m}}
      if(now-sent>50){sent=now;tx({t:'m',x:pos.x,y:pos.y,z:pos.z,yaw,pitch})}
    }
  }
  cam.position.set(pos.x,pos.y+1.6,pos.z);cam.rotation.set(pitch,yaw,0);
  for(const p of players.values()){if(!p.t)continue;p.g.position.lerp(p.t,.3);p.g.rotation.y=p.yaw}
  for(const mob of mobModels.values())mob.g.position.lerp(mob.target,.22);
  for(const a of arrows.values()){a.v.y-=a.g*dt;a.p.addScaledVector(a.v,dt);a.mesh.position.copy(a.p);a.mesh.lookAt(a.p.x+a.v.x,a.p.y+a.v.y,a.p.z+a.v.z)} // gravity curve
  for(const mark of impacts){const left=mark.userData.expires-now;if(left<=0){scene.remove(mark);impacts.delete(mark)}else if(left<500)mark.scale.setScalar(left/500)}
  const D=WD[WN[cur]],shotElapsed=shotAt[cur]?now-shotAt[cur]:Infinity;
  const rl=D.reload?Math.min(1,shotElapsed/D.reload):1,pull=charging&&D.charge?Math.min(1,(now-charging)/D.charge):0;

  if(cur===0){

    fpX.setNock(rl<1?-.45+rl*.25:-.2+pull*.08+snap);fpX.bolt.visible=rl>=1&&shotElapsed>.14;
    fpX.position.set(.16,-.2-shotPulse*.025,-.5+pull*.03+shotPulse*.14);fpX.rotation.x=shotPulse*.16;
  }else if(cur===1){
    const snap=shotElapsed<.18?-.08*(1-shotElapsed/.18):0;
    fpB.setNock(charging?pull*.28:snap,!!charging||shotElapsed>.18);
    fpB.position.set(.3+shotPulse*.015,-.22-shotPulse*.025,-.6+shotPulse*.12);fpB.rotation.x=-shotPulse*.12;
  }else if(cur===2){
    const reloading=shotAt[cur]>0&&rl<1;
    const reloadMotion=reloading?Math.sin(Math.PI*Math.max(0,Math.min(1,(rl-.12)/.76))):0;
    const rodMotion=reloading&&rl>.2&&rl<.78?Math.sin(Math.PI*(rl-.2)/.58):0;
    VM[2].position.set(.16+reloadMotion*.025,-.18-reloadMotion*.12-shotPulse*.03,-.4+reloadMotion*.06+shotPulse*.18);
    VM[2].rotation.x=reloadMotion*.24-shotPulse*.22;VM[2].ramrod.position.z=-.43+rodMotion*.3;
    VM[2].hammer.rotation.x=reloading&&rl>.78?-.6*(1-rl)/.22:0;
    VM[2].flash.visible=shotElapsed<.09;VM[2].flash.scale.setScalar(shotElapsed<.09?1+shotElapsed*4:0);
  }else if(cur===3){
    const slash=shotElapsed<.45?Math.sin(Math.PI*Math.min(1,shotElapsed/.28))*Math.max(0,1-shotElapsed/.45):0;
    VM[3].position.set(.22,-.18-slash*.06,-.4+slash*.18);VM[3].rotation.set(-slash*1.15,0,.4-slash*.55);
  }else{
    const stab=shotElapsed<.42?Math.sin(Math.PI*Math.min(1,shotElapsed/.3))*Math.max(0,1-shotElapsed/.42):0;
    VM[4].position.set(.22,-.2-stab*.03,-.45+stab*.2);
    if(knifeSlashStyle===0)VM[4].rotation.set(.5-stab*1.35,stab*.45,.5+stab*.1);
    else if(knifeSlashStyle===1)VM[4].rotation.set(.5-stab*1.75,0,.5-stab*.15);
    else VM[4].rotation.set(.5-stab*.2,stab*1.7,.5-stab*.65);
    knifeTrail.visible=joined&&!dead&&shotElapsed<.65;knifeTrail.material.opacity=knifeTrail.visible?Math.max(0,1-shotElapsed/.65)*.85:0;
    knifeTrail.position.set(.03,-.08,-.75);knifeTrail.scale.setScalar(.45+stab*.12);

  }
  const cb=$('charge').firstChild;cb.style.width=((rl<1?rl:pull)*100)+'%';cb.style.background=rl<1?'#888':pull>=1?'#5fbf6a':'#e0b341';
  const wt=WN.map((n,i)=>i===cur?'<b>'+n+'</b>':n).join(' · ')+(rl<1&&D.reload>1000?' — reloading '+((1-rl)*D.reload/1000).toFixed(1)+'s':'');
  if(wt!==frame.w){frame.w=wt;$('wpn').innerHTML=wt}
  rend.render(scene,cam);
}
requestAnimationFrame(frame);
