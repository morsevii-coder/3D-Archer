<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Archer</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#0a1a0e;color:#f3ecd2}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a5a34,#08140b 70%)}
#menu h1{font-size:64px;margin:0;font-weight:700;letter-spacing:1px;color:#f0d98a;text-shadow:0 3px 0 #5b3b14}
#menu p{margin:0 0 14px;opacity:.75}
#menu input,#menu button{padding:12px 16px;font:600 16px system-ui;border-radius:6px;border:0;width:270px}
#menu input{background:#f3ecd2;color:#1b2a1c}
#menu button{background:#e0b341;color:#2b1a05;cursor:pointer}#menu button.g{background:#5fbf6a;color:#06210b}
#menu button:focus-visible,#menu input:focus-visible{outline:3px solid #fff}
#menu .row{display:flex;gap:8px;width:270px}#menu .row input{width:140px;text-transform:uppercase;text-align:center}#menu .row button{width:122px}
#err{color:#ff9b8f;min-height:18px;font:14px system-ui}
#hud{position:fixed;inset:0;pointer-events:none;display:none;font-family:system-ui,sans-serif}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #fff9;border-radius:50%}
#cross.hit{border-color:#ff3b3b;transform:scale(1.5)}
#hearts{position:absolute;left:18px;bottom:16px;font-size:34px;letter-spacing:4px;text-shadow:0 2px 4px #000}
#me{position:absolute;left:18px;bottom:60px;font-size:18px;text-shadow:0 1px 3px #000}
#charge{position:absolute;left:50%;bottom:30px;width:200px;height:8px;margin-left:-100px;background:#0008;border-radius:4px;overflow:hidden}
#charge i{display:block;height:100%;width:0;background:#e0b341}
#code{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0009;padding:6px 14px;border-radius:6px;font-size:14px}
#feed{position:absolute;top:12px;left:14px;display:flex;flex-direction:column;gap:4px}
#feed div{background:#000a;padding:4px 10px;border-radius:3px;font-size:15px;width:fit-content}
#feed .me{outline:2px solid #e5484d}
#feed b.k{color:#ffd166}#feed b.v{color:#ff8a80}
#board{position:absolute;top:12px;right:14px;background:#0008;padding:8px 12px;border-radius:6px;font-size:14px;min-width:160px}
#board div{display:flex;justify-content:space-between;gap:16px}#board .me{color:#ffd166}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28px;background:#0006;text-align:center}
#flash{position:absolute;inset:0;background:#d00;opacity:0;transition:opacity .3s}
#tab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;min-width:420px;max-width:92vw;background:#07140bdd;border:2px solid #e0b341;border-radius:8px;padding:14px 18px}
#tab h2{margin:0 0 8px;font:700 20px Georgia,serif;color:#f0d98a}
#tab table{width:100%;border-collapse:collapse;font-size:16px}#tab th{text-align:left;opacity:.6;font-weight:500;padding:4px 8px}
#tab td{padding:5px 8px}#tab td+td,#tab th+th{text-align:right}#tab tr.me td{color:#ffd166;font-weight:700}#tab tr.x td{opacity:.45}
#wpn{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);font-size:15px;text-shadow:0 1px 3px #000;white-space:nowrap}#wpn b{color:#e0b341;font-size:17px}
#banner{position:absolute;top:58px;left:50%;transform:translateX(-50%);font:700 26px Georgia,serif;color:#f0d98a;text-shadow:0 2px 6px #000;text-align:center}
</style></head><body>
<div id="menu"><h1>3D Archer</h1><p>Three hearts. One arrow. Mind the drop.<br><small>Hold Tab for the scoreboard · M to mute · Q to swap weapon</small></p>
<input id="name" maxlength="14" placeholder="Your name">
<button class="g" id="pub">Play public match</button>
<button id="mk">Create lobby</button>
<div class="row"><input id="jc" maxlength="4" placeholder="CODE"><button id="jn">Join lobby</button></div>
<div id="err"></div></div>
<div id="hud"><div id="flash"></div><div id="cross"></div><div id="code"></div><div id="feed"></div><div id="board"></div>
<div id="me"></div><div id="hearts"></div><div id="charge"><i></i></div><div id="msg"></div><div id="wpn"></div><div id="banner"></div><div id="tab"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);
let ws,me=null,players=new Map(),arrows=new Map(),selfData=null,yaw=0,pitch=0,vy=0,charging=0,dead=false,locked=false,joined=false;
const pos=new THREE.Vector3(),keys={};let trees=[];
// ---------- scene ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd1a8);scene.fog=new THREE.Fog(0x9bd1a8,10,75);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);cam.rotation.order='YXZ';
const rend=new THREE.WebGLRenderer({antialias:true});rend.setSize(innerWidth,innerHeight);document.body.prepend(rend.domElement);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xffffff,0x335533,.9));
const sun=new THREE.DirectionalLight(0xfff2cc,.7);sun.position.set(30,50,20);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP*2+20,MAP*2+20),new THREE.MeshLambertMaterial({color:0x3e7a3a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const treeGroup=new THREE.Group();scene.add(treeGroup);
const trunkMat=new THREE.MeshLambertMaterial({color:0x5b3a1e}),leafMat=new THREE.MeshLambertMaterial({color:0x1f5a2a});
function buildTrees(seed){
  treeGroup.clear();trees=genTrees(seed);
  for(const t of trees){
    const k=new THREE.Mesh(new THREE.CylinderGeometry(t.r*.8,t.r,t.h,8),trunkMat);k.position.set(t.x,t.h/2,t.z);treeGroup.add(k);
    const l=new THREE.Mesh(new THREE.SphereGeometry(3+t.r*2,8,6),leafMat);l.position.set(t.x,t.h+1.5,t.z);treeGroup.add(l);
  }
}
const arrowGeo=new THREE.CylinderGeometry(.03,.03,1,5);arrowGeo.rotateX(Math.PI/2);
const arrowMat=new THREE.MeshBasicMaterial({color:0xf5e6b0});
// ---------- crossbow ----------
const woodMat=new THREE.MeshLambertMaterial({color:0x6b4423}),steelMat=new THREE.MeshLambertMaterial({color:0x3d4349});
const prodGeo=new THREE.TorusGeometry(.3,.022,6,20,Math.PI);prodGeo.rotateX(-Math.PI/2);
function mkXbow(){
  const g=new THREE.Group();
  const stock=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.75),woodMat);stock.position.z=-.1;
  const grip=new THREE.Mesh(new THREE.BoxGeometry(.05,.14,.06),woodMat);grip.position.set(0,-.09,.15);grip.rotation.x=.3;
  const prod=new THREE.Mesh(prodGeo,steelMat);prod.position.z=-.45;
  const sg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.3,0,-.45),new THREE.Vector3(0,0,-.2),new THREE.Vector3(.3,0,-.45)]);
  const strP=sg.attributes.position;
  const bolt=new THREE.Mesh(arrowGeo,new THREE.MeshLambertMaterial({color:0xf5e6b0}));bolt.scale.set(.7,.7,.5);bolt.position.y=.06;
  g.add(stock,grip,prod,new THREE.Line(sg,new THREE.LineBasicMaterial({color:0xeeeeee})),bolt);
  g.setNock=z=>{strP.setZ(1,z);strP.needsUpdate=true;bolt.position.z=z-.25};
  g.bolt=bolt;g.setNock(-.2);return g;
}
const fpX=mkXbow();fpX.position.set(.16,-.2,-.5);fpX.rotation.y=.04;cam.add(fpX);
let lastList=[],cur=0,bnT;
const shotAt=[0,0,0,0,0],WN=['crossbow','bow','musket','dagger','knife'];
const WD={crossbow:{charge:3000,reload:300},bow:{charge:1000,reload:300},musket:{charge:0,reload:5000},dagger:{charge:0,reload:600},knife:{charge:0,reload:700}};
const kindMat=[arrowMat,arrowMat,new THREE.MeshBasicMaterial({color:0xffd24a}),new THREE.MeshBasicMaterial({color:0xcfd8dc}),arrowMat];
const ASC=[[1,1,1.2],[1,1,1.2],[3,3,.35],[3,3,.4],[1,1,1]];
const bowGeo=new THREE.TorusGeometry(.4,.025,6,20,Math.PI);bowGeo.rotateZ(Math.PI/2);bowGeo.rotateY(-Math.PI/2);
function mkBow(){
  const g=new THREE.Group();g.add(new THREE.Mesh(bowGeo,woodMat));
  const sg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.4,0),new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.4,0)]),sp=sg.attributes.position;
  g.add(new THREE.Line(sg,new THREE.LineBasicMaterial({color:0xeeeeee})));
  const a=new THREE.Mesh(arrowGeo,new THREE.MeshLambertMaterial({color:0xf5e6b0}));a.scale.z=.8;g.add(a);
  g.setNock=(z,show)=>{sp.setZ(1,z);sp.needsUpdate=true;a.position.z=z-.4;a.visible=show};g.setNock(0,false);return g;
}
function mkMusket(){
  const g=new THREE.Group(),bar=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,1.1,8),steelMat);bar.rotation.x=Math.PI/2;bar.position.z=-.45;
  const st=new THREE.Mesh(new THREE.BoxGeometry(.06,.1,.5),woodMat);st.position.set(0,-.03,.2);g.add(bar,st);return g;
}
function mkBlade(len,w){
  const g=new THREE.Group(),bl=new THREE.Mesh(new THREE.BoxGeometry(w,.012,len),new THREE.MeshLambertMaterial({color:0xd0d6da}));bl.position.z=-len/2;
  const h=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,.14),woodMat);h.position.z=.07;
  g.add(bl,h,new THREE.Mesh(new THREE.BoxGeometry(.1,.02,.02),steelMat));return g;
}
const fpB=mkBow(),VM=[fpX,fpB,mkMusket(),mkBlade(.28,.035),mkBlade(.42,.05)];
[[0,0,0],[.3,-.22,-.6],[.16,-.18,-.4],[.22,-.18,-.4],[.22,-.2,-.45]].forEach((p,i)=>{if(i){VM[i].position.set(...p);cam.add(VM[i])}});
VM[3].rotation.z=.4;VM[4].rotation.z=.5;
// ---------- sound (synthesized, no files) ----------
let AC,master,NB;
function audio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const w=AC.createBufferSource(),wf=AC.createBiquadFilter(),wg=AC.createGain();w.buffer=NB;w.loop=true;wf.type='lowpass';wf.frequency.value=450;wg.gain.value=.06;w.connect(wf);wf.connect(wg);wg.connect(master);w.start();
  (function birds(){setTimeout(()=>{if(master.gain.value){const f=2000+Math.random()*1500;tone('sine',f,f*1.3,.09,.05);tone('sine',f*1.2,f*1.5,.09,.05,.12)}birds()},3000+Math.random()*6000)})();
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur);
}
function noise(dur,vol,f0,f1,type='bandpass'){
  if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
const sfx={
  draw:()=>tone('triangle',140,260,.9,.04),
  cock:()=>{[.1,.2,.3,.4,.5].forEach(d=>tone('square',1100,800,.03,.06,d));tone('square',300,200,.05,.2,.58)},
  shoot:()=>{tone('square',260,60,.08,.3);tone('triangle',500,200,.1,.2);noise(.12,.4,4000,800)},
  whoosh:v=>noise(.35,.3*v,2500,500),
  thunk:v=>{tone('sine',150,50,.12,.35*v);noise(.08,.2*v,900,300)},
  hit:()=>tone('sine',1100,1600,.12,.3),
  hurt:()=>{tone('square',160,50,.25,.2);noise(.15,.3,800,200,'lowpass')},
  kill:()=>{tone('sine',700,700,.12,.3);tone('sine',1050,1050,.22,.3,.1)},
  die:()=>tone('sawtooth',300,60,.6,.2),
  swap:()=>tone('square',600,900,.04,.08),
  crossbow:()=>{sfx.shoot();sfx.cock()},
  bow:()=>{tone('triangle',420,90,.18,.25);noise(.25,.35,3000,600)},
  musket:()=>{noise(.6,.8,2500,120,'lowpass');tone('sine',90,35,.4,.5);[1.2,2.4,3.4,4.3].forEach(d=>tone('square',800,500,.05,.1,d));tone('square',300,200,.06,.25,4.9)},
  dagger:()=>noise(.2,.3,5000,1500),
  knife:()=>noise(.18,.35,1200,4000)
};
function label(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='bold 34px system-ui';x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(text,128,45);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(2,.5,1);s.position.y=2.3;s.renderOrder=9;return s;
}
function mkPlayer(name,id){
  const g=new THREE.Group(),col=new THREE.Color().setHSL((id*.37)%1,.6,.5),m=new THREE.MeshLambertMaterial({color:col});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.2,8),m);b.position.y=.6;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshLambertMaterial({color:0xe8c39e}));h.position.y=1.5;
  const wb=mkXbow();wb.scale.setScalar(.7);wb.position.set(.3,1.1,0);g.add(b,h,wb,label(name));scene.add(g);return g;
}
// ---------- network ----------
function go(mode,code){audio();
  $('err').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:$('name').value.trim()||'Archer',mode,code}));
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{if(joined)location.reload();else if(!$('err').textContent)$('err').textContent='Cannot reach server'};
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function on(m){
  if(m.t==='err'){$('err').textContent=m.msg;ws.close()}
  else if(m.t==='welcome'){
    joined=true;me=m.id;buildTrees(m.seed);pos.set(m.x,0,m.z);
    $('menu').style.display='none';$('hud').style.display='block';
    $('code').textContent=(m.pub?'Public match':'Lobby code: '+m.code);showMsg('Click to play');
  }else if(m.t==='s')snapshot(m);
  else if(m.t==='kill'){
    if(m.ki===me)sfx.kill();else if(m.vi===me)sfx.die();
    const d=document.createElement('div');if(m.ki===me||m.vi===me)d.className='me';
    d.innerHTML=`<b class="k"></b> <span></span> <b class="v"></b>`;d.children[0].textContent=m.k;d.children[1].textContent=['🏹','🏹','🔫','🗡️','🔪'][m.w]+' '+WN[m.w];d.children[2].textContent=m.v;
    $('feed').append(d);setTimeout(()=>d.remove(),5000);if($('feed').children.length>6)$('feed').firstChild.remove();
  }else if(m.t==='rs'){pos.set(m.x,0,m.z);vy=0;dead=false;showMsg(locked?'':'Click to play')}
  else if(m.t==='bn'){$('banner').textContent=m.text;clearTimeout(bnT);bnT=setTimeout(()=>$('banner').textContent='',4500)}
  else if(m.t==='hurt'){sfx.hurt();$('flash').style.opacity=.5;setTimeout(()=>$('flash').style.opacity=0,120)}
  else if(m.t==='hit'){sfx.hit();$('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),150)}
}
function snapshot(m){
  const seen=new Set();
  for(const [id,name,x,y,z,yw,pt,hp,sc,dd,kl] of m.p){
    seen.add(id);
    if(id===me){selfData={hp,sc,kl};if(dd&&!dead){dead=true;showMsg('Eliminated. Respawning…')}continue}
    let p=players.get(id);if(!p){p={g:mkPlayer(name,id)};players.set(id,p)}
    p.t=new THREE.Vector3(x,y,z);p.yaw=yw;p.g.visible=!dd;if(!p.init){p.g.position.copy(p.t);p.init=1}
  }
  for(const [id,p] of players)if(!seen.has(id)){scene.remove(p.g);players.delete(id)}
  const as=new Set();
  for(const [id,x,y,z,vx,vy2,vz,g,k] of m.a){
    as.add(id);let a=arrows.get(id);
    if(!a){a={g,mesh:new THREE.Mesh(arrowGeo,kindMat[k]),p:new THREE.Vector3(),v:new THREE.Vector3()};a.mesh.scale.set(...ASC[k]);scene.add(a.mesh);arrows.set(id,a);const d0=Math.hypot(x-pos.x,y-pos.y-1.6,z-pos.z);if(d0>6&&d0<45)sfx.whoosh(1-d0/45)}
    a.p.set(x,y,z);a.v.set(vx,vy2,vz);
  }
  for(const [id,a] of arrows)if(!as.has(id)){const d1=a.p.distanceTo(cam.position);if(d1<45)sfx.thunk(1-d1/45);scene.remove(a.mesh);arrows.delete(id)}
  hud(m.p);
}
function hud(list){lastList=list;if($('tab').style.display==='block')renderTab();
  if(selfData){$('hearts').textContent='❤'.repeat(selfData.hp)+'🖤'.repeat(Math.max(0,3-selfData.hp));$('me').textContent=selfData.sc+' pts · '+selfData.kl+' kills'}
  $('board').innerHTML=[...list].sort((a,b)=>b[8]-a[8]).slice(0,6).map(p=>`<div class="${p[0]===me?'me':''}"><span>${p[1].replace(/</g,'&lt;')}</span><span>${p[8]}</span></div>`).join('');
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderTab(){
  $('tab').innerHTML='<h2>Scoreboard</h2><table><tr><th>Archer</th><th>Kills</th><th>Points</th><th>Hearts</th></tr>'+
  [...lastList].sort((a,b)=>b[8]-a[8]).map(p=>`<tr class="${p[0]===me?'me':p[9]?'x':''}"><td>${esc(p[1])}</td><td>${p[10]}</td><td>${p[8]}</td><td>${p[9]?'dead':'❤'.repeat(p[7])}</td></tr>`).join('')+'</table>';
}
function showTab(on){$('tab').style.display=on?'block':'none';if(on)renderTab()}
function showMsg(t){const e=$('msg');e.textContent=t;e.style.display=t?'flex':'none'}
// ---------- input ----------
$('pub').onclick=()=>go('public');$('mk').onclick=()=>go('create');
$('jn').onclick=()=>go('join',$('jc').value);
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Tab'){e.preventDefault();if(joined)showTab(true)}if(e.code==='KeyM'&&master)master.gain.value=master.gain.value?0:.5;if(e.code==='KeyQ'&&joined&&!dead&&!e.repeat){cur=(cur+1)%WN.length;charging=0;tx({t:'w',i:cur});sfx.swap()}});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code==='Tab')showTab(false)});addEventListener('blur',()=>showTab(false));
rend.domElement.addEventListener('click',()=>{audio();if(joined)rend.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===rend.domElement;showMsg(locked?(dead?'Eliminated. Respawning…':''):(joined?'Click to play':''))});
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))});
const fire=()=>{shotAt[cur]=performance.now();tx({t:'s',x:pos.x,y:pos.y,z:pos.z,yaw,pitch});sfx[WN[cur]]()};
addEventListener('mousedown',e=>{
  if(!locked||dead||e.button!==0)return;const D=WD[WN[cur]],now=performance.now();
  if(now-shotAt[cur]<D.reload)return;
  if(D.charge){charging=now;tx({t:'c'});sfx.draw()}else fire();
});
addEventListener('mouseup',e=>{ // charged weapons: hold the full time, then release to fire
  if(!charging||e.button!==0)return;const D=WD[WN[cur]],held=performance.now()-charging;charging=0;
  if(!dead&&held>=D.charge)fire();
});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
// ---------- loop ----------
let last=performance.now(),sent=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(joined&&locked){
    const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=(keys.ShiftLeft?9:6)*dt*(dead?2:1);
    const l=Math.hypot(f,s)||1,sy=Math.sin(yaw),cy=Math.cos(yaw);
    pos.x+=(-sy*f+cy*s)/l*sp;pos.z+=(-cy*f-sy*s)/l*sp;
    pos.x=Math.max(-MAP,Math.min(MAP,pos.x));pos.z=Math.max(-MAP,Math.min(MAP,pos.z));
    if(dead)pos.y=10;
    else{
      if(keys.Space&&pos.y===0)vy=7;vy-=20*dt;pos.y=Math.max(0,pos.y+vy*dt);if(pos.y===0)vy=0;
      for(const t of trees){const dx=pos.x-t.x,dz=pos.z-t.z,d=Math.hypot(dx,dz),m=t.r+.4;if(d<m&&d>0){pos.x=t.x+dx/d*m;pos.z=t.z+dz/d*m}}
      if(now-sent>50){sent=now;tx({t:'m',x:pos.x,y:pos.y,z:pos.z,yaw,pitch})}
    }
  }
  cam.position.set(pos.x,pos.y+1.6,pos.z);cam.rotation.set(pitch,yaw,0);
  for(const p of players.values()){if(!p.t)continue;p.g.position.lerp(p.t,.3);p.g.rotation.y=p.yaw}
  for(const a of arrows.values()){a.v.y-=a.g*dt;a.p.addScaledVector(a.v,dt);a.mesh.position.copy(a.p);a.mesh.lookAt(a.p.x+a.v.x,a.p.y+a.v.y,a.p.z+a.v.z)} // gravity curve
  const D=WD[WN[cur]],rl=Math.min(1,(now-shotAt[cur])/D.reload),pull=charging&&D.charge?Math.min(1,(now-charging)/D.charge):0;
  VM.forEach((m,i)=>m.visible=joined&&!dead&&i===cur);
  if(cur===0){fpX.setNock(rl<1?-.45+rl*.25:-.2+pull*.08);fpX.bolt.visible=rl>=1;fpX.position.set(.16,-.2,-.5+pull*.03)}
  else if(cur===1)fpB.setNock(pull*.28,!!charging);
  else if(cur===2)VM[2].rotation.x=rl<1?-.9*Math.sin(Math.min(1,rl*1.1)*Math.PI):0;
  else if(cur===3)VM[3].visible=VM[3].visible&&rl>=1;
  else{const sw=rl<.5?Math.sin(rl*2*Math.PI):0;VM[4].rotation.x=-sw*1.1;VM[4].position.z=-.45-sw*.25}
  const cb=$('charge').firstChild;cb.style.width=((rl<1?rl:pull)*100)+'%';cb.style.background=rl<1?'#888':pull>=1?'#5fbf6a':'#e0b341';
  const wt=WN.map((n,i)=>i===cur?'<b>'+n+'</b>':n).join(' · ')+(rl<1&&D.reload>1000?' — reloading '+((1-rl)*D.reload/1000).toFixed(1)+'s':'');
  if(wt!==frame.w){frame.w=wt;$('wpn').innerHTML=wt}
  rend.render(scene,cam);
}
requestAnimationFrame(frame);
</script></body></html>
