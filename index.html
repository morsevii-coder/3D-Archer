<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Archer</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Georgia,'Times New Roman',serif;background:#0a1a0e;color:#f3ecd2}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a5a34,#08140b 70%)}
#menu h1{font-size:64px;margin:0;font-weight:700;letter-spacing:1px;color:#f0d98a;text-shadow:0 3px 0 #5b3b14}
#menu p{margin:0 0 14px;opacity:.75}
#menu input,#menu button{padding:12px 16px;font:600 16px system-ui;border-radius:6px;border:0;width:270px}
#menu input{background:#f3ecd2;color:#1b2a1c}
#menu button{background:#e0b341;color:#2b1a05;cursor:pointer}#menu button.g{background:#5fbf6a;color:#06210b}
#menu button:focus-visible,#menu input:focus-visible{outline:3px solid #fff}
#menu .row{display:flex;gap:8px;width:270px}#menu .row input{width:140px;text-transform:uppercase;text-align:center}#menu .row button{width:122px}
#err{color:#ff9b8f;min-height:18px;font:14px system-ui}
#hud{position:fixed;inset:0;pointer-events:none;display:none;font-family:system-ui,sans-serif}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #fff9;border-radius:50%}
#cross.hit{border-color:#ff3b3b;transform:scale(1.5)}
#hearts{position:absolute;left:18px;bottom:16px;font-size:34px;letter-spacing:4px;text-shadow:0 2px 4px #000}
#me{position:absolute;left:18px;bottom:60px;font-size:18px;text-shadow:0 1px 3px #000}
#charge{position:absolute;left:50%;bottom:30px;width:200px;height:8px;margin-left:-100px;background:#0008;border-radius:4px;overflow:hidden}
#charge i{display:block;height:100%;width:0;background:#e0b341}
#code{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0009;padding:6px 14px;border-radius:6px;font-size:14px}
#feed{position:absolute;top:12px;left:14px;display:flex;flex-direction:column;gap:4px}
#feed div{background:#000a;padding:4px 10px;border-radius:3px;font-size:15px;width:fit-content}
#feed .me{outline:2px solid #e5484d}
#feed b.k{color:#ffd166}#feed b.v{color:#ff8a80}
#board{position:absolute;top:12px;right:14px;background:#0008;padding:8px 12px;border-radius:6px;font-size:14px;min-width:160px}
#board div{display:flex;justify-content:space-between;gap:16px}#board .me{color:#ffd166}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28px;background:#0006;text-align:center}
#flash{position:absolute;inset:0;background:#d00;opacity:0;transition:opacity .3s}
</style></head><body>
<div id="menu"><h1>3D Archer</h1><p>Three hearts. One arrow. Mind the drop.</p>
<input id="name" maxlength="14" placeholder="Your name">
<button class="g" id="pub">Play public match</button>
<button id="mk">Create lobby</button>
<div class="row"><input id="jc" maxlength="4" placeholder="CODE"><button id="jn">Join lobby</button></div>
<div id="err"></div></div>
<div id="hud"><div id="flash"></div><div id="cross"></div><div id="code"></div><div id="feed"></div><div id="board"></div>
<div id="me"></div><div id="hearts"></div><div id="charge"><i></i></div><div id="msg"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id);
let ws,me=null,players=new Map(),arrows=new Map(),selfData=null,yaw=0,pitch=0,vy=0,charging=0,dead=false,locked=false,joined=false;
const pos=new THREE.Vector3(),keys={};let trees=[];
// ---------- scene ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd1a8);scene.fog=new THREE.Fog(0x9bd1a8,10,75);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);cam.rotation.order='YXZ';
const rend=new THREE.WebGLRenderer({antialias:true});rend.setSize(innerWidth,innerHeight);document.body.prepend(rend.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x335533,.9));
const sun=new THREE.DirectionalLight(0xfff2cc,.7);sun.position.set(30,50,20);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP*2+20,MAP*2+20),new THREE.MeshLambertMaterial({color:0x3e7a3a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const treeGroup=new THREE.Group();scene.add(treeGroup);
const trunkMat=new THREE.MeshLambertMaterial({color:0x5b3a1e}),leafMat=new THREE.MeshLambertMaterial({color:0x1f5a2a});
function buildTrees(seed){
  treeGroup.clear();trees=genTrees(seed);
  for(const t of trees){
    const k=new THREE.Mesh(new THREE.CylinderGeometry(t.r*.8,t.r,t.h,8),trunkMat);k.position.set(t.x,t.h/2,t.z);treeGroup.add(k);
    const l=new THREE.Mesh(new THREE.SphereGeometry(3+t.r*2,8,6),leafMat);l.position.set(t.x,t.h+1.5,t.z);treeGroup.add(l);
  }
}
const arrowGeo=new THREE.CylinderGeometry(.03,.03,1,5);arrowGeo.rotateX(Math.PI/2);
const arrowMat=new THREE.MeshBasicMaterial({color:0xf5e6b0});
function label(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='bold 34px system-ui';x.textAlign='center';x.fillStyle='#000a';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(text,128,45);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(2,.5,1);s.position.y=2.3;s.renderOrder=9;return s;
}
function mkPlayer(name,id){
  const g=new THREE.Group(),col=new THREE.Color().setHSL((id*.37)%1,.6,.5),m=new THREE.MeshLambertMaterial({color:col});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,1.2,8),m);b.position.y=.6;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshLambertMaterial({color:0xe8c39e}));h.position.y=1.5;
  g.add(b,h,label(name));scene.add(g);return g;
}
// ---------- network ----------
function go(mode,code){
  $('err').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:$('name').value.trim()||'Archer',mode,code}));
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{if(joined)location.reload();else if(!$('err').textContent)$('err').textContent='Cannot reach server'};
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function on(m){
  if(m.t==='err'){$('err').textContent=m.msg;ws.close()}
  else if(m.t==='welcome'){
    joined=true;me=m.id;buildTrees(m.seed);pos.set(m.x,0,m.z);
    $('menu').style.display='none';$('hud').style.display='block';
    $('code').textContent=(m.pub?'Public match':'Lobby code: '+m.code);showMsg('Click to play');
  }else if(m.t==='s')snapshot(m);
  else if(m.t==='kill'){
    const d=document.createElement('div');if(m.ki===me||m.vi===me)d.className='me';
    d.innerHTML=`<b class="k"></b> 🏹 <b class="v"></b>`;d.children[0].textContent=m.k;d.children[1].textContent=m.v;
    $('feed').append(d);setTimeout(()=>d.remove(),5000);if($('feed').children.length>6)$('feed').firstChild.remove();
  }else if(m.t==='rs'){pos.set(m.x,0,m.z);vy=0;dead=false;showMsg(locked?'':'Click to play')}
  else if(m.t==='hurt'){$('flash').style.opacity=.5;setTimeout(()=>$('flash').style.opacity=0,120)}
  else if(m.t==='hit'){$('cross').classList.add('hit');setTimeout(()=>$('cross').classList.remove('hit'),150)}
}
function snapshot(m){
  const seen=new Set();
  for(const [id,name,x,y,z,yw,pt,hp,sc,dd,kl] of m.p){
    seen.add(id);
    if(id===me){selfData={hp,sc,kl};if(dd&&!dead){dead=true;showMsg('You were eliminated. Respawning…')}continue}
    let p=players.get(id);if(!p){p={g:mkPlayer(name,id)};players.set(id,p)}
    p.t=new THREE.Vector3(x,y,z);p.yaw=yw;p.g.visible=!dd;if(!p.init){p.g.position.copy(p.t);p.init=1}
  }
  for(const [id,p] of players)if(!seen.has(id)){scene.remove(p.g);players.delete(id)}
  const as=new Set();
  for(const [id,x,y,z,vx,vy2,vz] of m.a){
    as.add(id);let a=arrows.get(id);
    if(!a){a={mesh:new THREE.Mesh(arrowGeo,arrowMat),p:new THREE.Vector3(),v:new THREE.Vector3()};a.mesh.scale.z=1.2;scene.add(a.mesh);arrows.set(id,a)}
    a.p.set(x,y,z);a.v.set(vx,vy2,vz);
  }
  for(const [id,a] of arrows)if(!as.has(id)){scene.remove(a.mesh);arrows.delete(id)}
  hud(m.p);
}
function hud(list){
  if(selfData){$('hearts').textContent='❤'.repeat(selfData.hp)+'🖤'.repeat(Math.max(0,3-selfData.hp));$('me').textContent=selfData.sc+' pts · '+selfData.kl+' kills'}
  $('board').innerHTML=[...list].sort((a,b)=>b[8]-a[8]).slice(0,6).map(p=>`<div class="${p[0]===me?'me':''}"><span>${p[1].replace(/</g,'&lt;')}</span><span>${p[8]}</span></div>`).join('');
}
function showMsg(t){const e=$('msg');e.textContent=t;e.style.display=t?'flex':'none'}
// ---------- input ----------
$('pub').onclick=()=>go('public');$('mk').onclick=()=>go('create');
$('jn').onclick=()=>go('join',$('jc').value);
addEventListener('keydown',e=>{keys[e.code]=1});addEventListener('keyup',e=>{keys[e.code]=0});
rend.domElement.addEventListener('click',()=>{if(joined)rend.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===rend.domElement;showMsg(locked?(dead?'You were eliminated. Respawning…':''):(joined?'Click to play':''))});
addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022))});
addEventListener('mousedown',e=>{if(locked&&!dead&&e.button===0)charging=performance.now()});
addEventListener('mouseup',e=>{
  if(charging&&e.button===0){const c=Math.min(1,(performance.now()-charging)/1000);charging=0;$('charge').firstChild.style.width=0;
    if(!dead)tx({t:'s',c,x:pos.x,y:pos.y,z:pos.z,yaw,pitch})}
});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
// ---------- loop ----------
let last=performance.now(),sent=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(joined&&locked&&!dead){
    const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=(keys.ShiftLeft?9:6)*dt;
    const l=Math.hypot(f,s)||1,sy=Math.sin(yaw),cy=Math.cos(yaw);
    pos.x+=(-sy*f+cy*s)/l*sp;pos.z+=(-cy*f-sy*s)/l*sp;
    if(keys.Space&&pos.y===0)vy=7;vy-=20*dt;pos.y=Math.max(0,pos.y+vy*dt);if(pos.y===0)vy=0;
    pos.x=Math.max(-MAP,Math.min(MAP,pos.x));pos.z=Math.max(-MAP,Math.min(MAP,pos.z));
    for(const t of trees){const dx=pos.x-t.x,dz=pos.z-t.z,d=Math.hypot(dx,dz),m=t.r+.4;if(d<m&&d>0){pos.x=t.x+dx/d*m;pos.z=t.z+dz/d*m}}
    if(charging)$('charge').firstChild.style.width=Math.min(100,(now-charging)/10)+'%';
    if(now-sent>50){sent=now;tx({t:'m',x:pos.x,y:pos.y,z:pos.z,yaw,pitch})}
  }
  cam.position.set(pos.x,pos.y+1.6,pos.z);cam.rotation.set(pitch,yaw,0);
  for(const p of players.values()){if(!p.t)continue;p.g.position.lerp(p.t,.3);p.g.rotation.y=p.yaw}
  for(const a of arrows.values()){a.v.y-=G*dt;a.p.addScaledVector(a.v,dt);a.mesh.position.copy(a.p);a.mesh.lookAt(a.p.x+a.v.x,a.p.y+a.v.y,a.p.z+a.v.z)} // gravity curve
  rend.render(scene,cam);
}
requestAnimationFrame(frame);
</script></body></html>
